<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a18cd1" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.3" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Grid Pattern Background -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(79, 172, 254, 0.07)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(0, 242, 254, 0.15)" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.2px;
      fill: #e2e8f0;
    }
    .tagline-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ffffff;
    }
    /* Dynamic pulsing animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(25px, -18px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-20px, 22px); }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.15; }
      50% { opacity: 0.45; }
      100% { transform: translateY(420px); opacity: 0.15; }
    }
    .orb-anim1 {
      animation: floatOrb1 9s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .orb-anim2 {
      animation: floatOrb2 11s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .pulse-layer {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .scanner {
      animation: scanline 8s linear infinite;
    }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (KEPT STRICTLY IN BACKGROUND) -->
  <g class="pulse-layer">
    <!-- Glowing background nebula orbs -->
    <circle cx="220" cy="110" r="160" fill="#00f2fe" opacity="0.12" filter="url(#glow)" />
    <circle cx="980" cy="310" r="180" fill="#a18cd1" opacity="0.14" filter="url(#glow)" />
    <circle cx="600" cy="210" r="210" fill="#38ef7d" opacity="0.08" filter="url(#glow)" />
  </g>

  <!-- Floating animated ambient nodes -->
  <g class="orb-anim1">
    <circle cx="1050" cy="100" r="6" fill="#00f2fe" opacity="0.6" filter="url(#glow)" />
    <line x1="1050" y1="100" x2="1120" y2="150" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.3" />
    <circle cx="1120" cy="150" r="4" fill="#4facfe" opacity="0.6" />
  </g>
  <g class="orb-anim2">
    <circle cx="120" cy="330" r="5" fill="#38ef7d" opacity="0.6" filter="url(#glow)" />
    <line x1="120" y1="330" x2="190" y2="360" stroke="#38ef7d" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.3" />
    <circle cx="190" cy="360" r="4" fill="#11998e" opacity="0.6" />
  </g>

  <!-- Subtle dynamic scanning ray -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#textGrad)" stroke-width="1.5" class="scanner" opacity="0.3" />

  <!-- DECORATIVE ICON IN CORNER (Cloud Vault / Shield) -->
  <g transform="translate(1010, 50)" opacity="0.85" filter="url(#cardShadow)">
    <rect width="130" height="130" rx="28" fill="#111c38" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" />
    <!-- Cloud Path -->
    <path d="M 45 75 A 16 16 0 0 1 72 63 A 22 22 0 0 1 102 75 A 14 14 0 0 1 100 95 L 45 95 A 14 14 0 0 1 45 75 Z" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linejoin="round" />
    <!-- Lock / Keyhole in center of cloud -->
    <rect x="58" y="70" width="14" height="11" rx="2" fill="#38ef7d" />
    <circle cx="65" cy="67" r="4" fill="none" stroke="#38ef7d" stroke-width="2.2" />
  </g>

  <!-- FOREGROUND TEXT (PROMINENT, HIGH CONTRAST, ZERO OCCLUSION) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="268" height="30" rx="15" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#00f2fe" filter="url(#glow)" />
      <text x="28" y="20" class="pill-text" fill="#00f2fe">🔒 ZERO-KNOWLEDGE &amp; E2EE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text" fill="url(#textGrad)" filter="url(#cardShadow)">
      Awesome Cloud Drive &amp; Storage
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle-text">
      Encrypted File Storage, Self-Hosted Drives &amp; P2P Synchronization
    </text>

    <!-- Tagline description -->
    <text x="0" y="160" class="tagline-text">
      Curated ecosystem of enterprise-grade SaaS providers and sovereign, self-hosted open-source software.
    </text>

    <!-- FEATURE PILLS / TAGS (FOREGROUND) -->
    <g transform="translate(0, 205)">
      <!-- Pill 1: E2EE -->
      <g transform="translate(0, 0)">
        <rect width="160" height="34" rx="17" fill="#16223f" stroke="#00f2fe" stroke-width="1.2" filter="url(#cardShadow)" />
        <text x="80" y="22" class="pill-text" text-anchor="middle">🛡️ End-to-End Encrypted</text>
      </g>

      <!-- Pill 2: Self-Hosted -->
      <g transform="translate(175, 0)">
        <rect width="150" height="34" rx="17" fill="#16223f" stroke="#4facfe" stroke-width="1.2" filter="url(#cardShadow)" />
        <text x="75" y="22" class="pill-text" text-anchor="middle">🏠 Self-Hosted Cloud</text>
      </g>

      <!-- Pill 3: Client Vaults -->
      <g transform="translate(340, 0)">
        <rect width="165" height="34" rx="17" fill="#16223f" stroke="#38ef7d" stroke-width="1.2" filter="url(#cardShadow)" />
        <text x="82" y="22" class="pill-text" text-anchor="middle">🔐 Client-Side Vaults</text>
      </g>

      <!-- Pill 4: P2P Sync -->
      <g transform="translate(520, 0)">
        <rect width="145" height="34" rx="17" fill="#16223f" stroke="#a18cd1" stroke-width="1.2" filter="url(#cardShadow)" />
        <text x="72" y="22" class="pill-text" text-anchor="middle">⚡ P2P Sync &amp; S3</text>
      </g>

      <!-- Pill 5: Zero Knowledge -->
      <g transform="translate(680, 0)">
        <rect width="165" height="34" rx="17" fill="#16223f" stroke="#f093fb" stroke-width="1.2" filter="url(#cardShadow)" />
        <text x="82" y="22" class="pill-text" text-anchor="middle">🔑 Zero-Knowledge Keys</text>
      </g>
    </g>
  </g>
</svg>